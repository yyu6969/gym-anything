services:
  gitlab:
    image: gitlab/gitlab-ce:15.11.13-ce.0@sha256:798b18325a90851922c916fcded34d1ba7decf810a311765b43e43f452bf564c
    container_name: gitlab-ce
    restart: unless-stopped
    hostname: gitlab.localhost
    shm_size: "256m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['initial_root_password'] = 'GitLabRoot123!'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        gitlab_rails['usage_ping_enabled'] = false
        gitlab_rails['signup_enabled'] = false
        gitlab_rails['gitlab_default_projects_features_container_registry'] = false
        gitlab_rails['initial_default_branch_protection'] = 0
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 10
    ports:
      - "8929:8929"
      - "2224:22"
    volumes:
      - /home/ga/gitlab/config:/etc/gitlab
      - /home/ga/gitlab/logs:/var/log/gitlab
      - /home/ga/gitlab/data:/var/opt/gitlab
